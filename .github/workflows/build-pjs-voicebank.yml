name: Build PJS RealVoice preview

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'scripts/build_pjs_voicebank.py'
      - 'scripts/render_pjs_demo.py'
      - '.github/workflows/build-pjs-voicebank.yml'

permissions:
  contents: write

concurrency:
  group: pjs-realvoice-bank
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install audio tools
        run: |
          python -m pip install --disable-pip-version-check gdown
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Download official PJS singing sample
        run: |
          mkdir -p /tmp/pjs-preview
          gdown 'https://drive.google.com/uc?id=1NJ3_xuUFPRUfpI276yce1mcsHPpVdoCM' -O /tmp/pjs056_original.wav
          ffmpeg -hide_banner -loglevel error -y \
            -i /tmp/pjs056_original.wav \
            -ac 1 -ar 48000 -sample_fmt s16 \
            /tmp/pjs-preview/pjs056_song.wav
          test -s /tmp/pjs-preview/pjs056_song.wav

      - name: Download human-corrected labels
        run: git clone --depth 1 https://github.com/UtaUtaUtau/pjs-manual-labels.git /tmp/pjs-manual-labels

      - name: Build preview browser voicebank
        run: |
          python scripts/build_pjs_voicebank.py \
            --corpus /tmp/pjs-preview \
            --labels /tmp/pjs-manual-labels/lab \
            --out songsmith/voicebank/pjs \
            --max-units 160
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('songsmith/voicebank/pjs/manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['name'] = 'PJS RealVoice Preview — pjs056'
          data['preview_phrase'] = 'きみを きりたおした'
          data['preview_source_file'] = 'pjs056_song.wav'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          python scripts/render_pjs_demo.py \
            --bank songsmith/voicebank/pjs \
            --out songsmith/voicebank/pjs/demo_kimiwo_kiritaoshita.wav \
            --phrase 'きみを きりたおした' \
            --bpm 112
          du -sh songsmith/voicebank/pjs
          test -s songsmith/voicebank/pjs/manifest.json
          test -s songsmith/voicebank/pjs/demo_kimiwo_kiritaoshita.wav

      - name: Commit generated voicebank and demo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add songsmith/voicebank/pjs
          if git diff --cached --quiet; then
            echo 'Voicebank unchanged.'
          else
            git commit -m 'Build PJS RealVoice preview audio'
            git fetch origin master
            git rebase origin/master
            git push origin HEAD:master
          fi

      - name: Deploy generated bank to Star8
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: sv10008.star.ne.jp
          username: ${{ secrets.STAR8_FTP_USERNAME }}
          password: ${{ secrets.STAR8_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            scripts/**
