name: Deploy to test.noinoi.xyz

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Star8
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: sv10008.star.ne.jp
          username: ${{ secrets.STAR8_FTP_USERNAME }}
          password: ${{ secrets.STAR8_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
