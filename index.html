<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>noinoi.xyz TEST</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f7fb; color: #172033; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    .card { width: min(680px, 100%); background: #fff; border-radius: 24px; padding: 36px; box-shadow: 0 20px 60px rgba(20, 40, 80, .12); }
    .badge { display: inline-block; padding: 6px 12px; border-radius: 999px; background: #e8f1ff; color: #1d5fd1; font-weight: 700; font-size: 14px; }
    h1 { margin: 18px 0 10px; font-size: clamp(30px, 7vw, 52px); }
    p { line-height: 1.8; font-size: 17px; }
    code { background: #eef2f7; padding: 2px 6px; border-radius: 6px; }
    @media (prefers-color-scheme: dark) {
      body { background: #10131a; color: #eef2f7; }
      .card { background: #181d27; }
      code { background: #252c3a; }
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <span class="badge">TEST ENVIRONMENT</span>
      <h1>noinoi.xyz</h1>
      <p>このページは <code>test.noinoi.xyz</code> 用の実験ページです。</p>
      <p>GitHub → Star8 の自動デプロイ確認に使います。</p>
    </section>
  </main>
</body>
</html>
