<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>noinoi.xyz 自動デプロイ成功</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f7fb; color: #172033; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    .card { width: min(680px, 100%); background: #fff; border-radius: 24px; padding: 36px; box-shadow: 0 20px 60px rgba(20, 40, 80, .12); }
    .badge { display: inline-block; padding: 7px 13px; border-radius: 999px; background: #e8f1ff; color: #1d5fd1; font-weight: 800; font-size: 14px; }
    h1 { margin: 18px 0 10px; font-size: clamp(30px, 7vw, 52px); }
    p { line-height: 1.8; font-size: 17px; }
    .ok { margin-top: 24px; padding: 18px; border-radius: 16px; background: #eefaf2; font-weight: 700; }
    code { background: #eef2f7; padding: 2px 6px; border-radius: 6px; }
    @media (prefers-color-scheme: dark) {
      body { background: #10131a; color: #eef2f7; }
      .card { background: #181d27; }
      .ok { background: #173322; }
      code { background: #252c3a; }
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <span class="badge">LIVE DEPLOY TEST #2</span>
      <h1>自動デプロイ成功！</h1>
      <p>この変更はChatGPTからGitHubへ直接コミットしました。</p>
      <p><code>GitHub → Actions → Star8 → test.noinoi.xyz</code></p>
      <div class="ok">✓ ここが表示されれば、自動反映の仕組みは完成です。</div>
    </section>
  </main>
</body>
</html>
