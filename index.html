<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff7a59">
<title>あなたの夏休みタイプ診断</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#fff7ed,#eff6ff);color:#172033}.wrap{max-width:720px;margin:auto;padding:22px 16px 70px}.brand{font-weight:900;letter-spacing:.12em;font-size:12px;color:#ea580c}.card{background:#fff;border-radius:26px;padding:22px;box-shadow:0 18px 50px rgba(15,23,42,.1)}h1{font-size:clamp(34px,10vw,56px);line-height:1.05;margin:14px 0 12px}.lead{color:#64748b;line-height:1.7}.hero{font-size:56px}.start,.answer,.share,.again{width:100%;border:0;border-radius:16px;padding:15px 16px;font-size:16px;font-weight:800;cursor:pointer}.start{background:#f97316;color:#fff;margin-top:8px}.answer{background:#f8fafc;color:#172033;border:1px solid #e2e8f0;text-align:left;margin:7px 0}.answer:active{transform:scale(.99)}.progress{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-bottom:18px}.bar{height:100%;background:linear-gradient(90deg,#fb923c,#8b5cf6);width:0}.qno{font-size:13px;font-weight:800;color:#8b5cf6}.question{font-size:24px;font-weight:900;line-height:1.35;margin:8px 0 14px}.hidden{display:none}.resultBox{text-align:center}.type{font-size:34px;font-weight:900;margin:8px 0}.desc{line-height:1.8;color:#475569}.traits{display:grid;gap:8px;margin:18px 0}.trait{background:#fff7ed;border-radius:13px;padding:11px 13px;font-weight:700}.share{background:#0f172a;color:#fff;margin-top:8px}.again{background:#e2e8f0;color:#172033;margin-top:10px}.small{font-size:12px;color:#94a3b8;text-align:center;margin-top:18px}.tag{display:inline-block;background:#ffedd5;color:#c2410c;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:800}
</style>
</head>
<body><main class="wrap"><div class="brand">NOINOI LAB</div><section class="card" id="home"><div class="tag">30秒で診断</div><div class="hero">🌻</div><h1>あなたの<br>夏休みタイプ診断</h1><p class="lead">8問に答えるだけ。あなたの夏休みの過ごし方を、ちょっと笑える8タイプで診断します。</p><button class="start" id="startBtn">診断をはじめる</button></section>
<section class="card hidden" id="quiz"><div class="progress"><div class="bar" id="bar"></div></div><div class="qno" id="qno"></div><div class="question" id="question"></div><div id="answers"></div></section>
<section class="card hidden resultBox" id="result"><div class="tag">診断結果</div><div class="hero" id="emoji">😎</div><div class="type" id="type"></div><p class="desc" id="desc"></p><div class="traits" id="traits"></div><button class="share" id="shareBtn">結果をシェアする</button><button class="again" id="againBtn">もう一度やる</button></section><div class="small">noinoi LAB / test.noinoi.xyz</div></main>
<script>
function track(event,result=''){
  const body=new URLSearchParams({event});
  if(result!=='') body.set('result',String(result));
  try{
    if(navigator.sendBeacon){navigator.sendBeacon('analytics.php',body);}
    else{fetch('analytics.php',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body.toString(),keepalive:true}).catch(()=>{});}
  }catch(e){}
}
const qs=[
['夏休み初日、まず何する？',['予定表を作る','とりあえず遊ぶ','宿題を少し進める','昼まで寝る']],
['宿題はいつやる？',['最初の1週間','毎日ちょっとずつ','気が向いた時','最後の3日']],
['急に1日空いたら？',['行き先を調べる','友だちに連絡','家で趣味','何もしない']],
['自由研究と聞いて？',['テーマ選びから燃える','面白そうならやる','最低限でOK','存在を忘れる']],
['旅行前日は？',['持ち物を完璧に確認','テンションだけ高い','必要な物だけ準備','朝になって詰める']],
['夏祭りでは？',['混雑回避ルートを考える','屋台を全部見たい','写真を撮りたい','涼しい所にいたい']],
['8月後半の気分は？',['予定通りで安心','まだ遊び足りない','少し焦る','ここからが本番']],
['夏休み最終日の夜は？',['早寝して備える','思い出を振り返る','明日の準備','宿題と戦う']]
];
const types=[
['計画ガチ勢','📅','夏休みをプロジェクトとして管理するタイプ。予定が見えると安心。',['先回りが得意','締切に強い','予定表が好き']],
['全力エンジョイ勢','🏖️','楽しいことへの反応速度が最速。思い出の密度が高いタイプ。',['誘われたら行く','イベント好き','勢いが武器']],
['コツコツ安定型','🌱','派手さはなくても着実。最後にちゃんと帳尻を合わせるタイプ。',['継続力あり','バランス型','安心感高め']],
['最終日覚醒型','🔥','追い込まれてから本気を出す。締切直前に能力が跳ね上がるタイプ。',['短期集中','火事場に強い','謎の達成力']],
['自由研究研究者','🔬','気になることを掘り始めると止まらない。夏休みを探究に変えるタイプ。',['好奇心強め','深掘り好き','ハマると長い']],
['マイペース職人','🎧','人に流されず、自分の好きなことに時間を使うタイプ。',['一人時間好き','趣味に強い','ペースを守る']],
['思い出コレクター','📸','場所より誰と何をしたかを大切にするタイプ。',['共有好き','写真多め','記憶に残す']],
['宿題消失マジシャン','🪄','宿題の存在を視界から消す才能の持ち主。最終盤の逆転力に期待。',['現実逃避が上手','自由人','最終日に強制覚醒']]
];
let i=0,s=[0,0,0,0,0,0,0,0];
const $=id=>document.getElementById(id);
function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function render(){const q=qs[i];$('bar').style.width=((i)/qs.length*100)+'%';$('qno').textContent=`Q${i+1} / ${qs.length}`;$('question').textContent=q[0];$('answers').innerHTML='';q[1].forEach((a,idx)=>{const b=document.createElement('button');b.className='answer';b.textContent=a;b.onclick=()=>pick(idx);$('answers').appendChild(b)})}
function pick(idx){const map=[[0,1,2,3],[0,2,1,3],[0,1,5,3],[4,2,1,7],[0,1,2,3],[0,1,6,5],[0,1,2,3],[0,6,2,7]];s[map[i][idx]]+=2;s[(map[i][idx]+4)%8]+=1;i++;if(i<qs.length)render();else finish()}
function finish(){let n=s.indexOf(Math.max(...s));const t=types[n];$('emoji').textContent=t[1];$('type').textContent=t[0];$('desc').textContent=t[2];$('traits').innerHTML=t[3].map(x=>`<div class="trait">✓ ${x}</div>`).join('');history.replaceState(null,'',location.pathname+'?result='+n);track('complete',n);show('result')}
$('startBtn').onclick=()=>{i=0;s.fill(0);track('start');show('quiz');render()};$('againBtn').onclick=()=>{history.replaceState(null,'',location.pathname);show('home')};$('shareBtn').onclick=async()=>{track('share');const text=`私の夏休みタイプは「${$('type').textContent}」でした🌻\nあなたは何タイプ？`;const url=location.href;try{if(navigator.share)await navigator.share({title:'夏休みタイプ診断',text,url});else{await navigator.clipboard.writeText(text+'\n'+url);alert('結果をコピーしました')}}catch(e){}};
track('page_view');
const p=new URLSearchParams(location.search);if(p.has('result')){const n=Math.max(0,Math.min(7,Number(p.get('result'))||0));const t=types[n];$('emoji').textContent=t[1];$('type').textContent=t[0];$('desc').textContent=t[2];$('traits').innerHTML=t[3].map(x=>`<div class="trait">✓ ${x}</div>`).join('');track('result_view',n);show('result')}
</script></body></html>
