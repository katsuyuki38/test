<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>noinoi LAB</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#0f172a}
    .wrap{max-width:760px;margin:0 auto;padding:24px 18px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.brand{font-size:13px;font-weight:800;letter-spacing:.12em;color:#2563eb}.pill{font-size:12px;background:#e8f0ff;color:#1d4ed8;padding:7px 10px;border-radius:999px;font-weight:700}
    h1{font-size:clamp(32px,8vw,54px);margin:6px 0 8px}.sub{color:#64748b;margin:0 0 26px;line-height:1.6}.card{background:#fff;border-radius:24px;padding:18px;box-shadow:0 14px 40px rgba(15,23,42,.08)}
    .inputRow{display:grid;grid-template-columns:1fr auto;gap:10px}.inputRow input{width:100%;border:1px solid #dbe3ef;border-radius:14px;padding:14px 15px;font-size:16px;outline:none}.inputRow input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
    button{border:0;border-radius:14px;padding:0 16px;font-weight:800;font-size:15px;cursor:pointer}.add{background:#2563eb;color:#fff}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.stat{background:#f8fafc;padding:10px 12px;border-radius:12px;font-size:13px;color:#475569}.stat b{color:#0f172a}
    ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}.item{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid #e6ebf2;border-radius:16px;background:#fff}.item.done .text{text-decoration:line-through;color:#94a3b8}.check{width:24px;height:24px;border-radius:8px;border:2px solid #cbd5e1;background:#fff;display:grid;place-items:center;padding:0;flex:0 0 auto}.item.done .check{background:#22c55e;border-color:#22c55e;color:#fff}.text{flex:1;word-break:break-word}.del{background:#fff1f2;color:#e11d48;padding:8px 10px;border-radius:10px}.empty{text-align:center;color:#94a3b8;padding:26px 10px}
    .footer{margin-top:18px;text-align:center;color:#94a3b8;font-size:12px}.clear{margin-top:14px;width:100%;height:44px;background:#0f172a;color:#fff}.notice{margin-top:14px;background:#ecfdf5;color:#166534;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5}
    @media (prefers-color-scheme:dark){body{background:#0b1220;color:#e5e7eb}.card,.item{background:#111827}.sub,.footer{color:#94a3b8}.inputRow input{background:#0f172a;color:#fff;border-color:#334155}.stat{background:#0f172a;color:#94a3b8}.stat b{color:#fff}.item{border-color:#263244}.check{background:#111827;border-color:#475569}.clear{background:#e5e7eb;color:#111827}.notice{background:#123325;color:#bbf7d0}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top"><div class="brand">NOINOI LAB</div><div class="pill">test.noinoi.xyz</div></div>
    <h1>ミニ・タスク</h1>
    <p class="sub">iPhoneだけで使える、超シンプルなToDoです。入力内容はこの端末のブラウザ内に保存されます。</p>
    <section class="card">
      <div class="inputRow">
        <input id="taskInput" type="text" placeholder="やることを入力" autocomplete="off">
        <button class="add" id="addBtn">追加</button>
      </div>
      <div class="stats"><div class="stat">全件 <b id="total">0</b></div><div class="stat">完了 <b id="done">0</b></div><div class="stat">残り <b id="left">0</b></div></div>
      <ul id="list"></ul>
      <div id="empty" class="empty">まだタスクはありません。</div>
      <button class="clear" id="clearDone">完了したタスクを削除</button>
      <div class="notice">✓ このアプリはChatGPTからGitHubへ更新し、GitHub Actions経由でStar8へ自動デプロイしています。</div>
    </section>
    <div class="footer">noinoi LAB / first interactive app</div>
  </main>
  <script>
    const KEY='noinoi-mini-task-v1';
    let tasks=[];
    try{tasks=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){tasks=[]}
    const list=document.getElementById('list'), empty=document.getElementById('empty');
    const input=document.getElementById('taskInput');
    function save(){localStorage.setItem(KEY,JSON.stringify(tasks));render()}
    function render(){
      list.innerHTML='';
      tasks.forEach((t,i)=>{
        const li=document.createElement('li'); li.className='item'+(t.done?' done':'');
        const check=document.createElement('button'); check.className='check'; check.textContent=t.done?'✓':''; check.onclick=()=>{tasks[i].done=!tasks[i].done;save()};
        const text=document.createElement('div'); text.className='text'; text.textContent=t.text;
        const del=document.createElement('button'); del.className='del'; del.textContent='削除'; del.onclick=()=>{tasks.splice(i,1);save()};
        li.append(check,text,del); list.appendChild(li);
      });
      const d=tasks.filter(t=>t.done).length;
      document.getElementById('total').textContent=tasks.length;
      document.getElementById('done').textContent=d;
      document.getElementById('left').textContent=tasks.length-d;
      empty.style.display=tasks.length?'none':'block';
    }
    function add(){const v=input.value.trim();if(!v)return;tasks.unshift({text:v,done:false});input.value='';save();input.focus()}
    document.getElementById('addBtn').onclick=add;
    input.addEventListener('keydown',e=>{if(e.key==='Enter')add()});
    document.getElementById('clearDone').onclick=()=>{tasks=tasks.filter(t=>!t.done);save()};
    render();
  </script>
</body>
</html>
